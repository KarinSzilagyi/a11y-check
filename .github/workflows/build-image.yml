# Builds the audit service image and pushes it to GitHub Container Registry (free for public images).
# Runs on every push to main (except README/LICENSE-only changes), or by hand (Actions tab).
name: build image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Image names must be lowercase; GitHub user names may not be.
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/a11y-check:latest
            ghcr.io/${{ steps.owner.outputs.name }}/a11y-check:${{ github.sha }}
